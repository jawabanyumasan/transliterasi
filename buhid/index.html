<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aksara Buhid Transliterator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+Buhid&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .buhid-font {
            font-family: 'Noto Sans Buhid', 'Arial', sans-serif;
            font-size: 2.5rem;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* Custom scrollbar for better look */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8 text-slate-800">
    <div class="max-w-4xl w-full space-y-6">
        <!-- Header -->
        <header class="text-center space-y-3">
            <h1 class="text-4xl font-extrabold text-indigo-900 tracking-tight">Aksara Buhid</h1>
            <p class="text-slate-500 font-medium">Alat Transliterasi untuk Penutur Jawa & Umum</p>
        </header>

        <!-- Configuration Selector -->
        <div class="flex flex-col items-center space-y-3">
            <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Pilih Gaya Penulisan</label>
            <div class="inline-flex p-1 bg-slate-200 rounded-2xl shadow-inner">
                <button id="btn-abugida" onclick="setStyle('abugida')" class="px-4 py-2 text-sm font-semibold rounded-xl transition-all bg-white text-indigo-600 shadow-sm">Abugida (Tanpa Kotak)</button>
                <button id="btn-modern" onclick="setStyle('modern')" class="px-4 py-2 text-sm font-semibold rounded-xl transition-all text-slate-600">Modern (Pakai Pangkon)</button>
                <button id="btn-traditional" onclick="setStyle('traditional')" class="px-4 py-2 text-sm font-semibold rounded-xl transition-all text-slate-600">Tradisional (Kuno)</button>
            </div>
            <p id="styleDesc" class="text-[11px] text-slate-400 text-center max-w-xs leading-relaxed">
                Mode Abugida: Konsonan mati tetap muncul sebagai huruf dasar (misal: 'd' jadi 'da') tanpa tanda kotak.
            </p>
        </div>

        <!-- Main Card -->
        <main class="glass-morphism rounded-[2.5rem] shadow-2xl p-6 sm:p-10 space-y-8 border border-white">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Latin Section -->
                <div class="flex flex-col space-y-3">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-xs font-black text-slate-400 uppercase tracking-tighter">Huruf Latin</label>
                        <span class="text-[10px] bg-indigo-50 text-indigo-500 font-bold px-2 py-0.5 rounded-full border border-indigo-100">é, th, dh, ng, ny</span>
                    </div>
                    <textarea 
                        id="latinInput"
                        class="w-full h-56 p-6 bg-slate-50/50 border border-slate-200 rounded-[2rem] focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-400 outline-none transition-all resize-none text-slate-700 text-xl leading-relaxed shadow-inner"
                        placeholder="Ketik di sini..."></textarea>
                    <button 
                        onclick="copyToClipboard('latinInput')"
                        class="self-center sm:self-end px-6 py-2 hover:bg-slate-200 text-slate-500 text-xs font-bold rounded-full transition-all active:scale-95">
                        Salin Latin
                    </button>
                </div>

                <!-- Buhid Section -->
                <div class="flex flex-col space-y-3">
                    <label class="text-xs font-black text-slate-400 uppercase tracking-tighter px-1">Aksara Buhid</label>
                    <textarea 
                        id="buhidInput"
                        class="w-full h-56 p-6 bg-white border border-slate-200 rounded-[2rem] focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-400 outline-none transition-all resize-none text-indigo-900 buhid-font leading-[3.5rem] shadow-inner text-center"
                        placeholder="ᝐᝒᝑᝒ..."></textarea>
                    <button 
                        onclick="copyToClipboard('buhidInput')"
                        class="self-center sm:self-end px-8 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-full shadow-lg shadow-indigo-200 transition-all active:scale-95">
                        Salin Buhid
                    </button>
                </div>
            </div>
        </main>

        <!-- Visual Legend -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 px-2">
            <div class="bg-white p-3 rounded-2xl border border-slate-200 text-center">
                <div class="text-indigo-600 font-bold text-lg mb-1">ᝒ</div>
                <div class="text-[10px] text-slate-400 uppercase font-bold">Vokal I/E</div>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 text-center">
                <div class="text-indigo-600 font-bold text-lg mb-1">ᝓ</div>
                <div class="text-[10px] text-slate-400 uppercase font-bold">Vokal U/O</div>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 text-center">
                <div class="text-indigo-600 font-bold text-lg mb-1">ᝅ</div>
                <div class="text-[10px] text-slate-400 uppercase font-bold">Huruf NG</div>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 text-center">
                <div class="text-indigo-600 font-bold text-lg mb-1">᝔</div>
                <div class="text-[10px] text-slate-400 uppercase font-bold">Virama (Pangkon)</div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-3 rounded-full text-sm font-bold opacity-0 transition-all pointer-events-none shadow-2xl scale-90">
        Copied!
    </div>

    <script>
        const CONSONANTS = {
            'a': 'ᝀ', 'i': 'ᝁ', 'u': 'ᝂ',
            'ka': 'ᝃ', 'ga': 'ᝄ', 'nga': 'ᝅ',
            'ta': 'ᝆ', 'da': 'ᝇ', 'na': 'ᝈ',
            'pa': 'ᝉ', 'ba': 'ᝊ', 'ma': 'ᝋ',
            'ya': 'ᝌ', 'ra': 'ᝍ', 'la': 'ᝎ',
            'wa': 'ᝏ', 'sa': 'ᝐ', 'ha': 'ᝑ'
        };

        const VOWEL_MARKS = {
            'i': 'ᝒ', 'e': 'ᝒ', 'é': 'ᝒ',
            'u': 'ᝓ', 'o': 'ᝓ'
        };

        const VIRAMA = '᝔';
        let currentStyle = 'abugida';

        const latinInput = document.getElementById('latinInput');
        const buhidInput = document.getElementById('buhidInput');

        function setStyle(style) {
            currentStyle = style;
            const buttons = {
                'abugida': document.getElementById('btn-abugida'),
                'modern': document.getElementById('btn-modern'),
                'traditional': document.getElementById('btn-traditional')
            };
            const desc = document.getElementById('styleDesc');
            
            // Reset buttons
            Object.values(buttons).forEach(btn => {
                btn.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                btn.classList.add('text-slate-600');
            });

            // Set active
            buttons[style].classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
            buttons[style].classList.remove('text-slate-600');

            if (style === 'abugida') desc.innerText = "Mode Abugida: Konsonan mati tetap muncul sebagai huruf dasar (misal: 'd' jadi 'da') tanpa tanda kotak.";
            else if (style === 'modern') desc.innerText = "Mode Modern: Menggunakan tanda Virama (᝔) untuk mematikan vokal. Mungkin muncul kotak jika font tidak support.";
            else desc.innerText = "Mode Tradisional: Sesuai naskah kuno, konsonan mati di akhir suku kata tidak ditulis sama sekali.";

            updateConversion();
        }

        function latinToBuhid(text) {
            let t = text.toLowerCase();
            
            // Javanese Phonetic Cleaning
            t = t.replace(/é/g, 'e');
            t = t.replace(/th/g, 't');
            t = t.replace(/dh/g, 'd');
            t = t.replace(/f/g, 'p');
            t = t.replace(/v/g, 'b');
            t = t.replace(/z/g, 's');
            t = t.replace(/kh/g, 'h');
            t = t.replace(/sy/g, 's');

            let result = '';
            let i = 0;

            while (i < t.length) {
                let char = t[i];
                let next = t[i + 1] || '';
                let cluster = char + next;

                let currentBase = '';

                // 1. Check for clusters first (NG, NY)
                if (cluster === 'ng') {
                    currentBase = CONSONANTS['nga'];
                    i += 2;
                } else if (cluster === 'ny') {
                    // NY as NA + (virama) + YA
                    currentBase = CONSONANTS['na'] + (currentStyle === 'modern' ? VIRAMA : '') + CONSONANTS['ya'];
                    i += 2;
                } 
                // 2. Check for individual vowels
                else if (['a', 'i', 'u', 'e', 'o'].includes(char)) {
                    if (char === 'a') currentBase = CONSONANTS['a'];
                    else if (['i', 'e'].includes(char)) currentBase = CONSONANTS['i'];
                    else currentBase = CONSONANTS['u'];
                    i += 1;
                }
                // 3. Check for regular consonants
                else if (CONSONANTS[char + 'a']) {
                    currentBase = CONSONANTS[char + 'a'];
                    i += 1;
                }
                else {
                    result += char;
                    i++;
                    continue;
                }

                // Look ahead for vowel attachment
                let nextChar = t[i] || '';
                if (['a', 'i', 'u', 'e', 'o'].includes(nextChar)) {
                    if (nextChar !== 'a') {
                        result += currentBase + (VOWEL_MARKS[nextChar] || '');
                    } else {
                        result += currentBase;
                    }
                    i++;
                } else {
                    // Coda (Dead Consonant) logic
                    const isStandaloneVowel = ['ᝀ', 'ᝁ', 'ᝂ'].includes(currentBase);
                    if (!isStandaloneVowel && currentBase.length === 1) {
                        if (currentStyle === 'modern') {
                            result += currentBase + VIRAMA;
                        } else if (currentStyle === 'abugida') {
                            result += currentBase; // Show the 'a' version visually
                        } else {
                            // Traditional: drop the coda (don't add anything)
                        }
                    } else {
                        result += currentBase;
                    }
                }
            }
            return result;
        }

        function buhidToLatin(text) {
            const revCons = Object.fromEntries(Object.entries(CONSONANTS).map(([k, v]) => [v, k]));
            const revVows = { 'ᝒ': 'i', 'ᝓ': 'u', '᝔': '' };
            let result = '';
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let next = text[i+1] || '';
                if (revCons[char]) {
                    let base = revCons[char].replace('a', '');
                    if (revVows[next] !== undefined) {
                        result += base + (revVows[next] || '');
                        i++;
                    } else {
                        result += base + 'a';
                    }
                } else if (char === ' ') result += ' ';
                else if (!revVows[char]) result += char;
            }
            return result;
        }

        function updateConversion() {
            buhidInput.value = latinToBuhid(latinInput.value);
        }

        latinInput.addEventListener('input', updateConversion);
        buhidInput.addEventListener('input', () => {
            latinInput.value = buhidToLatin(buhidInput.value);
        });

        function copyToClipboard(id) {
            const el = document.getElementById(id);
            el.select();
            document.execCommand('copy');
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) scale(1)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) scale(0.9)';
            }, 1500);
        }
    </script>
</body>
</html>
