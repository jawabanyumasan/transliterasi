<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lontara Script (Aksara Bugis) for Javanese</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus+Jakarta+Sans', sans-serif;
            background: #f8fafc;
        }

        /* Lontara Unicode Range: 1A00–1A1F */
        .lontara-text {
            font-size: 2rem;
            line-height: 1.5;
            color: #1e293b;
        }

        .custom-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .btn-action {
            transition: all 0.2s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        /* Tooltip for copy success */
        #copy-toast {
            display: none;
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-900 mb-2">Transliterasi Lontara</h1>
            <p class="text-slate-600">Translator Aksara Bugis untuk Penutur Jawa (Supports th, dh, é, f, z)</p>
        </header>

        <!-- Main Interface -->
        <div class="space-y-6">
            
            <!-- Input Section -->
            <div class="custom-card p-6">
                <div class="flex items-center justify-between mb-4">
                    <label id="input-label" class="font-semibold text-slate-700">Latin (Jawa/Indo)</label>
                    <button onclick="swapModes()" class="flex items-center gap-2 text-indigo-600 hover:text-indigo-800 font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 16-4-4 4-4"/><path d="m17 8 4 4-4 4"/><path d="M3 12h18"/></svg>
                        Ganti Mode
                    </button>
                </div>
                <textarea id="input-area" placeholder="Ketik di sini (Contoh: sego, thole, dhahar...)" 
                    class="w-full h-32 p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none resize-none text-lg"></textarea>
            </div>

            <!-- Arrow Icon -->
            <div class="flex justify-center -my-3 relative z-10">
                <div class="bg-indigo-600 text-white p-2 rounded-full shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
                </div>
            </div>

            <!-- Output Section -->
            <div class="custom-card p-6">
                <div class="flex items-center justify-between mb-4">
                    <label id="output-label" class="font-semibold text-slate-700">Aksara Lontara</label>
                    <button onclick="copyToClipboard()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-700 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        Salin
                    </button>
                </div>
                <div id="output-area" class="lontara-text min-h-[8rem] w-full p-4 bg-slate-50 rounded-xl border border-dashed border-slate-300 break-all">
                    ...
                </div>
            </div>

            <!-- Reference Table Toggle -->
            <div class="text-center">
                <button onclick="toggleGuide()" class="text-slate-500 hover:text-indigo-600 underline text-sm">
                    Tampilkan Panduan Karakter
                </button>
            </div>

            <div id="guide" class="hidden custom-card p-6 overflow-x-auto">
                <h3 class="font-bold text-slate-800 mb-4">Pemetaan Karakter Khusus</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                    <div class="p-2 border rounded"><b>th/dh/d/t:</b> Disatukan ke ᨈ / ᨉ</div>
                    <div class="p-2 border rounded"><b>é / e:</b> ᨙ (E taling)</div>
                    <div class="p-2 border rounded"><b>f / v:</b> Disamakan ke ᨄ (P)</div>
                    <div class="p-2 border rounded"><b>sy / kh / z:</b> Standar Bugis</div>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div id="copy-toast" class="bg-slate-800 text-white px-6 py-2 rounded-full shadow-xl">
            Berhasil disalin!
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('input-area');
        const outputArea = document.getElementById('output-area');
        const inputLabel = document.getElementById('input-label');
        const outputLabel = document.getElementById('output-label');

        let isLatinToLontara = true;

        // Lontara Dictionary Mapping
        // Standard Bugis + Handle common loan variants
        const mapLatinToLontara = {
            'ka': 'ᨀ', 'ga': 'ᨁ', 'nga': 'ᨂ', 'ngka': 'ᨃ',
            'pa': 'ᨄ', 'ba': 'ᨅ', 'ma': 'ᨆ', 'mpa': 'ᨇ',
            'ta': 'ᨈ', 'da': 'ᨉ', 'na': 'ᨊ', 'nra': 'ᨋ',
            'ca': 'ᨌ', 'ja': 'ᨍ', 'nya': 'ᨎ', 'nca': 'ᨏ',
            'ya': 'ᨐ', 'ra': 'ᨑ', 'la': 'ᨒ', 'wa': 'ᨓ',
            'sa': 'ᨔ', 'a': 'ᨕ', 'ha': 'ᨖ',
            
            // Javanese Phonetics Mapping
            'tha': 'ᨈ', // Map Javanese retroflex to closest Lontara
            'dha': 'ᨉ',
            'fa': 'ᨄ',
            'va': 'ᨄ',
            'za': 'ᨔ',
            'kha': 'ᨀ',
            'sya': 'ᨔ'
        };

        const vowels = {
            'i': 'ᨄᨗ'.substring(1), // ◌ᨗ
            'u': 'ᨄᨘ'.substring(1), // ◌ᨘ
            'e': 'ᨙᨄ'.substring(0, 1), // ᨙ◌ (pre-positional)
            'é': 'ᨙᨄ'.substring(0, 1), // ᨙ◌ 
            'o': 'ᨚᨄ'.substring(0, 1), // ◌ᨚ (actually post-positional in most fonts, but logic handles it)
            'ə': '' // Schwa is inherent/not explicitly marked in traditional Lontara, or becomes silent
        };

        const mapLontaraToLatin = {};
        for (let key in mapLatinToLontara) {
            mapLontaraToLatin[mapLatinToLontara[key]] = key.replace('a', '');
        }

        function transliterate(text) {
            if (isLatinToLontara) {
                return convertToLontara(text.toLowerCase());
            } else {
                return convertToLatin(text);
            }
        }

        function convertToLontara(text) {
            // Normalize "é" to "e" for logic or treat same
            let result = "";
            let i = 0;

            // Simple greedy parser
            while (i < text.length) {
                let found = false;
                
                // Try 3-char clusters (ngk, mpa, etc)
                let chunk3 = text.substring(i, i + 3);
                let chunk3_a = chunk3 + "a";
                if (mapLatinToLontara[chunk3_a]) {
                    result += applyVowel(mapLatinToLontara[chunk3_a], text[i+3]);
                    i += (isVowel(text[i+3]) ? 4 : 3);
                    found = true;
                }

                if (!found) {
                    // Try 2-char clusters (ng, ny, th, dh, kh, sy, ba, etc)
                    let chunk2 = text.substring(i, i + 2);
                    let chunk2_a = chunk2 + "a";
                    
                    if (mapLatinToLontara[chunk2_a]) {
                        result += applyVowel(mapLatinToLontara[chunk2_a], text[i+2]);
                        i += (isVowel(text[i+2]) ? 3 : 2);
                        found = true;
                    }
                }

                if (!found) {
                    // Try 1-char
                    let chunk1 = text.substring(i, i + 1);
                    let chunk1_a = chunk1 + "a";

                    if (mapLatinToLontara[chunk1_a]) {
                        result += applyVowel(mapLatinToLontara[chunk1_a], text[i+1]);
                        i += (isVowel(text[i+1]) ? 2 : 1);
                        found = true;
                    } else if (chunk1 === " ") {
                        result += " ";
                        i++;
                        found = true;
                    } else {
                        // Keep unknown characters
                        result += chunk1;
                        i++;
                        found = true;
                    }
                }
            }
            return result;
        }

        function isVowel(char) {
            return char && "aiueéoə".includes(char);
        }

        function applyVowel(baseChar, vowelChar) {
            if (!vowelChar || !vowels[vowelChar]) return baseChar;
            
            // Lontara Vowel placement:
            // e (e taling) is BEFORE the consonant ᨙ◌
            if (vowelChar === 'e' || vowelChar === 'é') {
                return 'ᨙ' + baseChar;
            }
            // o is usually a mark after/around, but Unicode handles it as a combining mark
            if (vowelChar === 'o') {
                return baseChar + 'ᨚ';
            }
            if (vowelChar === 'i') return baseChar + 'ᨗ';
            if (vowelChar === 'u') return baseChar + 'ᨘ';
            
            return baseChar;
        }

        function convertToLatin(text) {
            // Basic reversal - Lontara is abugida, latin is alphabetic
            // This is a simplified reversal as Lontara doesn't mark end-consonants (pangkon)
            let result = "";
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let next = text[i+1];

                if (char === 'ᨙ') {
                    // Prefix vowel E
                    if (next && mapLontaraToLatin[next]) {
                        result += mapLontaraToLatin[next] + "e";
                        i++;
                    } else {
                        result += "e";
                    }
                } else if (mapLontaraToLatin[char]) {
                    let base = mapLontaraToLatin[char];
                    if (next === 'ᨗ') { result += base + "i"; i++; }
                    else if (next === 'ᨘ') { result += base + "u"; i++; }
                    else if (next === 'ᨚ') { result += base + "o"; i++; }
                    else { result += base + "a"; }
                } else {
                    result += char;
                }
            }
            return result;
        }

        function swapModes() {
            isLatinToLontara = !isLatinToLontara;
            if (isLatinToLontara) {
                inputLabel.innerText = "Latin (Jawa/Indo)";
                outputLabel.innerText = "Aksara Lontara";
                inputArea.placeholder = "Ketik di sini (Contoh: sego, thole, dhahar...)";
            } else {
                inputLabel.innerText = "Aksara Lontara";
                outputLabel.innerText = "Latin (Jawa/Indo)";
                inputArea.placeholder = "Tempel Aksara Lontara di sini...";
            }
            updateOutput();
        }

        function updateOutput() {
            const val = inputArea.value;
            if (!val) {
                outputArea.innerText = "...";
                return;
            }
            outputArea.innerText = transliterate(val);
        }

        function copyToClipboard() {
            const text = outputArea.innerText;
            if (text === "...") return;

            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            // Show Toast
            const toast = document.getElementById('copy-toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        function toggleGuide() {
            const guide = document.getElementById('guide');
            guide.classList.toggle('hidden');
        }

        inputArea.addEventListener('input', updateOutput);
    </script>
</body>
</html>
