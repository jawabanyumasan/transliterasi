<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaana Banyumasan Auto v7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Thaana:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .thaana-text {
            direction: rtl;
            font-family: 'Noto Sans Thaana', sans-serif;
            line-height: 1.8;
            font-size: 2rem;
        }

        .custom-card {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .ltr-mode { direction: ltr; text-align: left; font-family: 'Inter', sans-serif; }
        .rtl-mode { direction: rtl; text-align: right; }
        
        /* Highlight for the key rules */
        .key-badge {
            @apply bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-3xl w-full bg-white rounded-[2.5rem] p-8 md:p-12 custom-card border border-slate-100">
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-black text-slate-900 tracking-tight">Thaana Banyumasan</h1>
            <div class="flex items-center justify-center gap-3 mt-4">
                <span class="px-4 py-1 bg-amber-100 text-amber-700 text-xs font-black rounded-full uppercase tracking-wider">Versi 7.0</span>
                <span id="directionLabel" class="text-slate-400 text-sm font-semibold tracking-wide uppercase">Mendeteksi Input...</span>
            </div>
        </header>

        <!-- Quick Guide Area -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <h3 class="text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">Vokal Pendek</h3>
                <div class="flex flex-wrap gap-2 text-sm">
                    <span>a <span class="key-badge">ަ</span></span>
                    <span>i <span class="key-badge">ި</span></span>
                    <span>u <span class="key-badge">ު</span></span>
                    <span>e (pepet) <span class="key-badge">ަް</span></span>
                    <span>é (taling) <span class="key-badge">ެ</span></span>
                    <span>o <span class="key-badge">ޮ</span></span>
                </div>
            </div>
            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
                <h3 class="text-xs font-bold text-indigo-400 mb-2 uppercase tracking-widest">Vokal Panjang</h3>
                <div class="flex flex-wrap gap-2 text-sm">
                    <span>aa/ā <span class="key-badge">ާ</span></span>
                    <span>ii/ī <span class="key-badge">ީ</span></span>
                    <span>uu/ū <span class="key-badge">ޫ</span></span>
                    <span>ee/ē <span class="key-badge">ޭ</span></span>
                    <span>oo/ō <span class="key-badge">ޯ</span></span>
                </div>
            </div>
        </div>

        <div class="space-y-8">
            <!-- Input -->
            <div class="relative">
                <label class="absolute -top-3 left-6 bg-white px-2 text-xs font-bold text-slate-400 uppercase tracking-tighter">Input Area</label>
                <textarea 
                    id="input" 
                    placeholder="Ketik: 'mangan' atau 'mangāaan'..."
                    class="w-full h-40 p-6 rounded-3xl border-2 border-slate-100 focus:border-indigo-500 focus:ring-8 focus:ring-indigo-50/50 outline-none transition-all text-xl resize-none shadow-sm"
                ></textarea>
            </div>

            <!-- Output -->
            <div class="relative">
                <div class="flex items-center justify-between mb-2 px-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-tighter">Hasil Konversi</label>
                    <button 
                        onclick="copyOutput()" 
                        class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all shadow-lg shadow-indigo-200 active:scale-95"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        SALIN TEKS
                    </button>
                </div>
                <textarea 
                    id="output" 
                    readonly 
                    class="w-full h-44 p-6 rounded-3xl border-2 border-indigo-50 bg-indigo-50/30 text-indigo-950 outline-none resize-none overflow-y-auto transition-all"
                ></textarea>
            </div>
        </div>

        <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-2xl text-sm font-bold shadow-2xl transition-all duration-300 opacity-0 translate-y-10 pointer-events-none">
            ✨ Teks berhasil disalin ke clipboard!
        </div>

        <footer class="mt-12 text-center">
            <p class="text-[9px] text-slate-300 font-black uppercase tracking-[0.4em]">Banyumasan Heritage Preservation Project</p>
        </footer>
    </div>

    <script>
        const inputArea = document.getElementById("input");
        const outputArea = document.getElementById("output");
        const directionLabel = document.getElementById("directionLabel");
        const toast = document.getElementById("toast");

        // Transliteration Maps
        const L2T_CONSONANTS = {
            b: "ބ", c: "ޗ", d: "ދ", g: "ގ", h: "ހ", j: "ޖ", k: "ކ", 
            l: "ލ", m: "މ", n: "ނ", p: "ޕ", r: "ރ", s: "ސ", t: "ތ", 
            w: "ވ", v: "ވ", y: "ޔ", f: "ފ", z: "ޒ",
            kh: "ޚ", sy: "ޝ", ng: "ންގ", ny: "ޏ", th: "ތްހ", dh: "ދްހ"
        };

        const L2T_VOWELS = {
            // Short
            a: "ަ", i: "ި", u: "ު", e: "ަް", "é": "ެ", o: "ޮ",
            // Long
            aa: "ާ", ii: "ީ", uu: "ޫ", ee: "ޭ", oo: "ޯ",
            "ā": "ާ", "ī": "ީ", "ū": "ޫ", "ē": "ޭ", "ō": "ޯ"
        };

        const L2T_OTHERS = {
            "0": "٠", "1": "١", "2": "٢", "3": "٣", "4": "٤",
            "5": "٥", "6": "٦", "7": "٧", "8": "٨", "9": "٩",
            ",": "،", "?": "؟", ";": "؛", "!": "!", ".": "."
        };

        function isThaana(text) {
            return /[\u0780-\u07BF]/.test(text);
        }

        function toThaana(text) {
            if (!text) return "";
            
            // Normalize & Lowercase
            let processed = text.toLowerCase();

            // 1. Handle Long Vowels (Patterns: aa, ii, uu, ee, oo)
            // We do this before clusters to avoid 'ng' in 'aa' etc.
            const longVowelPatterns = ["aa", "ii", "uu", "ee", "oo"];
            longVowelPatterns.forEach(p => {
                processed = processed.replace(new RegExp(p, 'g'), L2T_VOWELS[p]);
            });

            // 2. Handle Clusters
            const clusters = ["kh", "sy", "ng", "ny", "th", "dh"];
            clusters.forEach(c => {
                processed = processed.replace(new RegExp(c, 'g'), L2T_CONSONANTS[c]);
            });

            let result = "";
            for (let i = 0; i < processed.length; i++) {
                let char = processed[i];
                
                // Jika karakter adalah tanda vokal Thaana (pendek atau panjang yang sudah diganti di langkah 1)
                // atau vokal sisa (a, i, u, e, o, é, ā, ī, ū, ē, ō)
                const thaanaVowel = /[\u07A6-\u07B0]/.test(char);
                const latinVowelMark = L2T_VOWELS[char];

                if (thaanaVowel || latinVowelMark) {
                    const finalVowel = thaanaVowel ? char : latinVowelMark;
                    
                    // Check for Alifu carrier
                    const prev = result.slice(-1);
                    const isPrevConsonant = /[\u0780-\u07A5]/.test(prev);
                    
                    if (isPrevConsonant) {
                        result += finalVowel;
                    } else {
                        result += "އ" + finalVowel;
                    }
                } else if (L2T_CONSONANTS[char]) {
                    result += L2T_CONSONANTS[char];
                } else if (L2T_OTHERS[char]) {
                    result += L2T_OTHERS[char];
                } else {
                    result += char;
                }
            }
            return result;
        }

        function toLatin(text) {
            if (!text) return "";
            let res = text;
            
            // Reverse mapping order: Long/Complex first
            const reverseMap = [
                // Vowels Long
                {t: "ާ", l: "aa"}, {t: "ީ", l: "ii"}, {t: "ޫ", l: "uu"}, 
                {t: "ޭ", l: "ee"}, {t: "ޯ", l: "oo"},
                // Vowels Short
                {t: "ަް", l: "e"}, {t: "ަ", l: "a"}, {t: "ި", l: "i"}, 
                {t: "ު", l: "u"}, {t: "ެ", l: "é"}, {t: "ޮ", l: "o"},
                // Consonant Clusters
                {t: "ންގ", l: "ng"}, {t: "ޏ", l: "ny"}, {t: "ތްހ", l: "th"}, 
                {t: "ދްހ", l: "dh"}, {t: "ޚ", l: "kh"}, {t: "ޝ", l: "sy"},
                // Single Consonants
                {t: "ބ", l: "b"}, {t: "ޗ", l: "c"}, {t: "ދ", l: "d"}, 
                {t: "ގ", l: "g"}, {t: "ހ", l: "h"}, {t: "ޖ", l: "j"}, 
                {t: "ކ", l: "k"}, {t: "ލ", l: "l"}, {t: "މ", l: "m"}, 
                {t: "ނ", l: "n"}, {t: "ޕ", l: "p"}, {t: "ރ", l: "r"}, 
                {t: "ސ", l: "s"}, {t: "ތ", l: "t"}, {t: "ވ", l: "w"}, 
                {t: "ޔ", l: "y"}, {t: "ފ", l: "f"}, {t: "ޒ", l: "z"},
                // Others
                {t: "٠", l: "0"}, {t: "١", l: "1"}, {t: "٢", l: "2"}, 
                {t: "٣", l: "3"}, {t: "٤", l: "4"}, {t: "٥", l: "5"}, 
                {t: "٦", l: "6"}, {t: "٧", l: "7"}, {t: "٨", l: "8"}, 
                {t: "٩", l: "9"}, {t: "،", l: ","}, {t: "؟", l: "?"}, {t: "؛", l: ";"}
            ];

            // Clean Alifu carriers before vowels
            res = res.replace(/އ(?=[\u07A6-\u07AF])/g, "");

            reverseMap.forEach(item => {
                res = res.split(item.t).join(item.l);
            });

            return res;
        }

        function update() {
            const val = inputArea.value;
            if (isThaana(val)) {
                directionLabel.textContent = "Thaana → Latin";
                outputArea.value = toLatin(val);
                outputArea.className = "w-full h-44 p-6 rounded-3xl border-2 border-indigo-50 bg-indigo-50/30 text-indigo-950 ltr-mode outline-none resize-none overflow-y-auto text-xl";
            } else {
                directionLabel.textContent = "Latin → Thaana";
                outputArea.value = toThaana(val);
                outputArea.className = "w-full h-44 p-6 rounded-3xl border-2 border-indigo-50 bg-indigo-50/30 text-indigo-900 thaana-text rtl-mode outline-none resize-none overflow-y-auto";
            }
        }

        function copyOutput() {
            if (!outputArea.value) return;
            outputArea.select();
            document.execCommand('copy');
            
            toast.classList.remove("opacity-0", "translate-y-10", "pointer-events-none");
            toast.classList.add("opacity-100", "translate-y-0", "pointer-events-auto");
            
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-10", "pointer-events-none");
                toast.classList.remove("opacity-100", "translate-y-0", "pointer-events-auto");
            }, 2500);
        }

        inputArea.addEventListener("input", update);
    </script>
</body>
</html>
