<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuneiform Javanese Transliteration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Cuneiform&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans', sans-serif;
        }
        .cuneiform-font {
            font-family: 'Noto Sans Cuneiform', serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d4d4d4;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a3a3a3;
        }
        @keyframes bounce-in {
            0% { transform: translate(-50%, 100%); opacity: 0; }
            70% { transform: translate(-50%, -20px); opacity: 1; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-animate {
            animation: bounce-in 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-neutral-50 text-neutral-900 p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-amber-900 mb-2">
                Aksara Kuneiform Jawa
            </h1>
            <p class="text-neutral-600">Transliterasi Fonetik Jawa ke Karakter Kuneiform Mesopotamia</p>
        </header>

        <!-- Main Interface -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
            
            <!-- Latin Input -->
            <div class="flex flex-col space-y-2">
                <label class="text-sm font-semibold uppercase tracking-wider text-neutral-500">Latin (Jawa)</label>
                <textarea
                    id="latinInput"
                    class="w-full h-48 p-4 bg-white border-2 border-amber-100 rounded-xl shadow-sm focus:border-amber-500 focus:outline-none transition-all resize-none text-lg"
                    placeholder="Ketik di sini (contoh: Sugeng enjang, pripun kabare?)"
                ></textarea>
                <div class="flex justify-between items-center px-1">
                    <button 
                        onclick="copyText('latinInput')"
                        class="text-neutral-400 hover:text-amber-600 transition-colors flex items-center gap-1 text-sm"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        Salin Latin
                    </button>
                </div>
            </div>

            <!-- Arrow Icon (Desktop) -->
            <div class="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 bg-amber-500 text-white p-2 rounded-full shadow-lg border-4 border-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 8 4 4-4 4"/><path d="M2 12h20"/><path d="m6 8-4 4 4 4"/></svg>
            </div>

            <!-- Cuneiform Output -->
            <div class="flex flex-col space-y-2">
                <label class="text-sm font-semibold uppercase tracking-wider text-neutral-500">Aksara Kuneiform</label>
                <textarea
                    id="cuneiformOutput"
                    class="cuneiform-font w-full h-48 p-4 bg-amber-50 border-2 border-amber-200 rounded-xl shadow-sm focus:border-amber-500 focus:outline-none transition-all resize-none text-2xl text-amber-950"
                    placeholder="Hasil Kuneiform..."
                ></textarea>
                <div class="flex justify-between items-center px-1">
                    <button 
                        onclick="copyText('cuneiformOutput')"
                        class="text-amber-700 hover:text-amber-900 font-medium transition-colors flex items-center gap-1 text-sm bg-amber-100 px-3 py-1 rounded-full"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        Salin Kuneiform
                    </button>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-8 flex flex-wrap justify-center gap-4">
            <button 
                onclick="clearText()"
                class="flex items-center gap-2 bg-white border-2 border-red-100 text-red-500 px-6 py-3 rounded-full hover:bg-red-50 transition-all font-semibold shadow-sm"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                Bersihkan Teks
            </button>
            <button 
                onclick="toggleModal(true)"
                class="flex items-center gap-2 bg-amber-900 text-white px-6 py-3 rounded-full hover:bg-amber-800 transition-all font-semibold shadow-md"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                Panduan Aksara
            </button>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 hidden items-center gap-2 bg-green-600 text-white px-6 py-3 rounded-full shadow-2xl z-50 toast-animate">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <span class="font-medium">Aksara Berhasil Disalin</span>
        </div>

        <!-- Info Modal -->
        <div id="infoModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 overflow-y-auto">
            <div class="bg-white rounded-3xl p-6 md:p-8 max-w-2xl w-full shadow-2xl relative" onclick="event.stopPropagation()">
                <button 
                    onclick="toggleModal(false)"
                    class="absolute top-4 right-4 text-neutral-400 hover:text-neutral-600 text-2xl"
                >
                    ✕
                </button>
                <h2 class="text-2xl font-bold text-amber-900 mb-6">Panduan Transliterasi</h2>
                
                <div class="space-y-6 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar" id="modalContent">
                    <!-- Content will be injected by JS -->
                </div>

                <div class="mt-8 pt-4 border-t border-neutral-100 text-center">
                    <button 
                        onclick="toggleModal(false)"
                        class="bg-amber-900 text-white px-8 py-2 rounded-full font-bold hover:bg-amber-800 transition-all"
                    >
                        Dimengerti
                    </button>
                </div>
            </div>
        </div>

        <footer class="mt-12 text-center text-sm text-neutral-400">
            Dibuat dengan sistem pemetaan fonetis Kuneiform-Jawa.<br/>
            Karakter Kuneiform diambil dari standar Unicode block (U+12000).
        </footer>
    </div>

    <script>
        const mapping = {
            'th': '𒋼', 'dh': '𒁲', 'ng': '𒂷', 'ny': '𒉌', 
            'kh': '𒄩', 'sy': '𒅆', 'gh': '𒂵',
            'h': '𒀸', 'n': '𒈾', 'c': '𒍝', 'r': '𒊏', 'k': '𒅗',
            'f': 'ᕝ', 'v': 'ᕝ', 't': '𒋫', 's': '𒊓', 'w': '𒉿',
            'l': '𒆷', 'p': 'পা', 'd': '𒁕', 'j': '𒄑', 'y': '𒅀',
            'm': '𒈠', 'g': 'ᡤ', 'b': '𒁀', 'q': '𒆪', 'z': '𒍣',
            '0': '0', '1': '𒁹', '2': '𒈫', '3': '𒁹𒁹𒁹', '4': 'ត្ត', '5': '𒐊', 
            '6': '𒐋', '7': '柒', '8': '捌', '9': '玖',
        };

        const vowels = {
            'a': '', 'i': '𒄿', 'u': '𒌋', 'e': '𒂊', 'é': '𒂍', 'o': 'ឡិចត្រូនិច',
        };

        const specials = {
            'r_final': '𒅕', 'h_final': '𒄴', 'ng_final': '𒅎', 'y_medial': 'ᔾ', 'r_medial': 'ྲ',
        };

        const latinInput = document.getElementById('latinInput');
        const cuneiformOutput = document.getElementById('cuneiformOutput');
        const modal = document.getElementById('infoModal');
        const toast = document.getElementById('toast');

        function isVowel(char) {
            return char && vowels[char.toLowerCase()] !== undefined;
        }

        function processSyllable(baseChar, input, index) {
            let text = baseChar;
            let i = index;

            // Medials
            if (i < input.length) {
                if (input[i] === 'y' && !isVowel(input[i+1])) {
                    text += specials.y_medial;
                    i++;
                } else if (input[i] === 'r' && !isVowel(input[i+1])) {
                    text += specials.r_medial;
                    i++;
                }
            }

            // Vowels
            if (i < input.length && vowels[input[i]] !== undefined) {
                text += vowels[input[i]];
                i++;
            }

            // Finals
            if (i < input.length) {
                if (input.substring(i, i+2) === 'ng' && !isVowel(input[i+2])) {
                    text += specials.ng_final;
                    i += 2;
                } else if (input[i] === 'r' && !isVowel(input[i+1])) {
                    text += specials.r_final;
                    i++;
                } else if (input[i] === 'h' && !isVowel(input[i+1])) {
                    text += specials.h_final;
                    i++;
                }
            }

            return { text, newIndex: i };
        }

        function convertToCuneiform(text) {
            let result = '';
            let i = 0;
            const input = text.toLowerCase();

            while (i < input.length) {
                let found = false;
                if (i + 1 < input.length) {
                    const pair = input.substring(i, i + 2);
                    if (mapping[pair]) {
                        let res = processSyllable(mapping[pair], input, i + 2);
                        result += res.text;
                        i = res.newIndex;
                        found = true;
                    }
                }

                if (!found) {
                    const single = input[i];
                    if (mapping[single]) {
                        let res = processSyllable(mapping[single], input, i + 1);
                        result += res.text;
                        i = res.newIndex;
                    } else if (vowels[single] !== undefined) {
                        result += '𒀀' + vowels[single];
                        i++;
                    } else {
                        result += input[i];
                        i++;
                    }
                }
            }
            return result;
        }

        function convertToLatin(text) {
            let result = text;
            const allMaps = [
                ...Object.entries(specials).map(([k, v]) => [v, k.split('_')[0]]),
                ...Object.entries(vowels).map(([k, v]) => [v, k]).filter(x => x[0] !== ''),
                ...Object.entries(mapping).map(([k, v]) => [v, k]),
                ['𒀀', 'a']
            ];

            allMaps.sort((a, b) => b[0].length - a[0].length).forEach(([cun, lat]) => {
                result = result.split(cun).join(lat);
            });
            return result;
        }

        latinInput.addEventListener('input', (e) => {
            cuneiformOutput.value = convertToCuneiform(e.target.value);
        });

        cuneiformOutput.addEventListener('input', (e) => {
            latinInput.value = convertToLatin(e.target.value);
        });

        function clearText() {
            latinInput.value = '';
            cuneiformOutput.value = '';
        }

        function copyText(id) {
            const el = document.getElementById(id);
            if (!el.value) return;
            el.select();
            document.execCommand('copy');
            
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2000);
        }

        function toggleModal(show) {
            modal.classList.toggle('hidden', !show);
            modal.classList.toggle('flex', show);
            if (show) renderModalContent();
        }

        function renderModalContent() {
            const container = document.getElementById('modalContent');
            container.innerHTML = `
                <section>
                    <h3 class="font-bold text-amber-700 border-b border-amber-100 pb-1 mb-3 uppercase text-xs tracking-widest">Aksara Utama</h3>
                    <div class="grid grid-cols-4 sm:grid-cols-5 gap-2 text-center">
                        ${Object.entries(mapping).slice(0, 20).map(([k, v]) => `
                            <div class="bg-amber-50 p-2 rounded-lg">
                                <div class="text-xl cuneiform-font">${v}</div>
                                <div class="text-xs text-neutral-500 font-bold uppercase">${k}</div>
                            </div>
                        `).join('')}
                    </div>
                </section>
                <section class="mt-6">
                    <h3 class="font-bold text-amber-700 border-b border-amber-100 pb-1 mb-3 uppercase text-xs tracking-widest">Sandhangan (Vokal)</h3>
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 text-center">
                        ${Object.entries(vowels).map(([k, v]) => `
                            <div class="bg-blue-50 p-2 rounded-lg">
                                <div class="text-xl cuneiform-font">${v || '◌'}</div>
                                <div class="text-xs text-neutral-500 font-bold uppercase">${k}</div>
                            </div>
                        `).join('')}
                    </div>
                </section>
                <section class="mt-6">
                    <h3 class="font-bold text-amber-700 border-b border-amber-100 pb-1 mb-3 uppercase text-xs tracking-widest">Panyigeg & Medial</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div class="bg-green-50 p-2 rounded-lg flex justify-between px-4 italic text-sm">Layar (-r): <span class="cuneiform-font text-lg not-italic">${specials.r_final}</span></div>
                        <div class="bg-green-50 p-2 rounded-lg flex justify-between px-4 italic text-sm">Wignyan (-h): <span class="cuneiform-font text-lg not-italic">${specials.h_final}</span></div>
                        <div class="bg-green-50 p-2 rounded-lg flex justify-between px-4 italic text-sm">Cecak (-ng): <span class="cuneiform-font text-lg not-italic">${specials.ng_final}</span></div>
                        <div class="bg-purple-50 p-2 rounded-lg flex justify-between px-4 italic text-sm">Cakra (r): <span class="cuneiform-font text-lg not-italic">${specials.r_medial}</span></div>
                    </div>
                </section>
            `;
        }

        // Close modal on background click
        modal.addEventListener('click', () => toggleModal(false));
    </script>
</body>
</html>
