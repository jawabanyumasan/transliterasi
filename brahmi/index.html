<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brahmi Javanese Pro - Transliterasi Aksara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .brahmi-font {
            font-family: 'Noto Sans Brahmi', serif;
            font-size: 1.8rem;
            line-height: 2.8rem;
        }
        textarea {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }
        .swap-transition {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4">
    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- Header & Fitur Aplikasi -->
        <header class="text-center space-y-4">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">
                Aksara <span class="text-indigo-600">Brahmi</span> Jawa
            </h1>
            <p class="text-slate-500 text-sm font-medium max-w-3xl mx-auto leading-relaxed">
                Transliterasi 2-Arah • Multi-Paragraf • Sandhangan Otomatis • Seselan (ky, kr, kl) • Fonetik Jawa (th, dh, ng, ny, é)
            </p>
        </header>

        <!-- Container Utama -->
        <div class="bg-white rounded-[2rem] shadow-2xl overflow-hidden flex flex-col md:flex-row border border-slate-200">
            
            <!-- Kolom Input (Kiri/Atas) -->
            <div id="colLeft" class="flex-1 p-8 flex flex-col gap-4 bg-slate-50/50">
                <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                    <span id="labelLeft" class="text-xs font-bold text-slate-500 uppercase tracking-widest">Latin (Input)</span>
                    <button onclick="clearText()" class="text-[10px] bg-slate-200 hover:bg-red-500 hover:text-white text-slate-600 px-3 py-1 rounded-lg transition-all font-bold">BERSIHKAN</button>
                </div>
                <textarea 
                    id="inputArea" 
                    class="w-full h-80 md:h-[400px] py-4 bg-transparent focus:ring-0 outline-none text-xl resize-none placeholder:text-slate-300 leading-relaxed"
                    placeholder="Masukkan teks Latin di sini (contoh: sugeng, dhahar, krapyak)..."
                ></textarea>
            </div>

            <!-- Kontrol Switch (Tengah) -->
            <div class="flex md:flex-col items-center justify-center p-4 bg-white relative z-10 border-y md:border-y-0 md:border-x border-slate-100">
                <button 
                    onclick="switchMode()" 
                    class="p-5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-xl transform active:scale-90 transition-all group"
                    title="Tukar Mode"
                >
                    <svg id="switchIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 swap-transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                    </svg>
                </button>
            </div>

            <!-- Kolom Hasil (Kanan/Bawah) -->
            <div id="colRight" class="flex-1 p-8 flex flex-col gap-4">
                <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                    <span id="labelRight" class="text-xs font-bold text-indigo-500 uppercase tracking-widest">Aksara Brahmi (Hasil)</span>
                    <button onclick="copyResult()" class="text-[10px] bg-indigo-100 hover:bg-indigo-600 hover:text-white text-indigo-700 px-3 py-1 rounded-lg transition-all font-bold">SALIN HASIL</button>
                </div>
                <textarea 
                    id="outputArea" 
                    class="brahmi-font w-full h-80 md:h-[400px] py-4 bg-transparent focus:ring-0 outline-none resize-none placeholder:text-slate-300"
                    readonly
                    placeholder="Hasil aksara akan muncul secara otomatis..."
                ></textarea>
            </div>
        </div>

        <footer class="text-center text-slate-400 text-xs">
            <p>&copy; 2024 Brahmi Javanese Pro - Alat bantu pelestarian aksara kuno.</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-900 text-white rounded-2xl opacity-0 pointer-events-none transition-opacity duration-300 shadow-2xl text-sm font-semibold z-50">
        Teks berhasil disalin!
    </div>

    <script>
        const MAP = {
            'a': '𑀅', 'ā': '𑀆', 'i': '𑀇', 'ī': '𑀈', 'u': '𑀉', 'ū': '𑀊', 'e': '𑀏', 'é': '𑀏', 'ai': '𑀐', 'o': '𑀑', 'au': '𑀒',
            'k': '𑀓', 'kh': '𑀔', 'g': '𑀕', 'gh': '𑀖', 'ng': '𑀗',
            'c': '𑀘', 'ch': '𑀙', 'j': '𑀚', 'jh': '𑀛', 'ny': '𑀜',
            'th': '𑀝', 'ṭh': '𑀞', 'dh': '𑀟', 'ḍh': '𑀠', 'ṇ': '𑀡',
            't': '𑀢', 'th_low': '𑀣', 'd': '𑀤', 'dh_low': '𑀥', 'n': '𑀦',
            'p': '𑀧', 'ph': '𑀨', 'b': '𑀩', 'bh': '𑀪', 'm': '𑀫',
            'y': '𑀬', 'r': '𑀭', 'l': '𑀮', 'w': '𑀯', 'v': '𑀯',
            'sy': '𑀰', 'ṣ': '𑀱', 's': '𑀲', 'h': '𑀳', 'f': '𑀨', 'z': '𑀚',
            'm_ā': '𑀸', 'm_i': '𑀹', 'm_ī': '𑀺', 'm_u': '𑀻', 'm_ū': '𑀼', 'm_e': '𑁂', 'm_é': '𑁂', 'm_ai': '𑁃', 'm_o': '𑁄', 'm_au': '𑁅',
            'virama': '𑁆', 'anusvara': '𑀁', 'visarga': '𑀂'
        };

        const VOWELS = ['a','ā','i','ī','u','ū','e','é','ai','o','au'];
        const SEQUENCES = ['kh', 'gh', 'ng', 'ch', 'jh', 'ny', 'th', 'dh', 'sy', 'ai', 'au', 'ā', 'ī', 'ū', 'é'];
        
        const REVERSE_MAP = {};
        Object.entries(MAP).forEach(([k, v]) => {
            if (!k.startsWith('m_') && k !== 'virama' && k !== 'anusvara' && k !== 'visarga') {
                REVERSE_MAP[v] = k;
            }
        });
        const MATRA_MAP = {};
        Object.entries(MAP).forEach(([k, v]) => {
            if (k.startsWith('m_')) MATRA_MAP[v] = k.replace('m_', '');
        });

        let currentMode = 'latinToBrahmi';

        function processLatinToBrahmi(input) {
            if (!input) return "";
            return input.split('\n').map(line => {
                let text = line.toLowerCase();
                let result = "";
                let i = 0;

                while (i < text.length) {
                    let char = "";
                    for (let seq of SEQUENCES) {
                        if (text.substr(i, seq.length) === seq) {
                            char = seq;
                            break;
                        }
                    }
                    if (!char) char = text[i];

                    if (!MAP[char] && !VOWELS.includes(char)) {
                        result += char;
                        i++;
                        continue;
                    }

                    if (VOWELS.includes(char) && (i === 0 || text[i-1] === ' ')) {
                        result += MAP[char];
                        i += char.length;
                        continue;
                    }

                    if (MAP[char] && !VOWELS.includes(char)) {
                        let cluster = MAP[char];
                        i += char.length;

                        let next = "";
                        for (let seq of SEQUENCES) { if (text.substr(i, seq.length) === seq) { next = seq; break; } }
                        if (!next) next = text[i] || "";

                        if (VOWELS.includes(next)) {
                            if (next !== 'a') cluster += MAP['m_' + next];
                            i += next.length;
                        } else if (['y', 'r', 'l'].includes(next)) {
                            cluster += MAP['virama'] + MAP[next];
                            i += next.length;
                            let vAfter = "";
                            for (let seq of SEQUENCES) { if (text.substr(i, seq.length) === seq) { vAfter = seq; break; } }
                            if (!vAfter) vAfter = text[i] || "";
                            if (VOWELS.includes(vAfter)) {
                                if (vAfter !== 'a') cluster += MAP['m_' + vAfter];
                                i += vAfter.length;
                            } else {
                                cluster += MAP['virama'];
                            }
                        } else {
                            cluster += MAP['virama'];
                        }
                        result += cluster;
                        continue;
                    }
                    i++;
                }
                result = result.split('𑀗𑁆').join('𑀁');
                result = result.split('𑀳𑁆').join('𑀂');
                return result;
            }).join('\n');
        }

        function processBrahmiToLatin(input) {
            if (!input) return "";
            return input.split('\n').map(line => {
                const chars = [...line];
                let lineResult = "";
                for (let i = 0; i < chars.length; i++) {
                    let c = chars[i];
                    if (REVERSE_MAP[c]) {
                        lineResult += REVERSE_MAP[c];
                    } else if (MATRA_MAP[c]) {
                        lineResult += MATRA_MAP[c];
                    } else if (c === '𑁆') {
                        // Skip virama
                    } else if (c === '𑀁') {
                        lineResult += 'ng';
                    } else if (c === '𑀂') {
                        lineResult += 'h';
                    } else {
                        lineResult += c;
                    }
                }
                return lineResult;
            }).join('\n');
        }

        function solve() {
            const input = document.getElementById('inputArea').value;
            const output = document.getElementById('outputArea');
            if (currentMode === 'latinToBrahmi') {
                output.value = processLatinToBrahmi(input);
            } else {
                output.value = processBrahmiToLatin(input);
            }
        }

        function switchMode() {
            currentMode = currentMode === 'latinToBrahmi' ? 'brahmiToLatin' : 'latinToBrahmi';
            
            const inputArea = document.getElementById('inputArea');
            const outputArea = document.getElementById('outputArea');
            const labelLeft = document.getElementById('labelLeft');
            const labelRight = document.getElementById('labelRight');
            const switchIcon = document.getElementById('switchIcon');

            const tempValue = inputArea.value;
            inputArea.value = outputArea.value;
            outputArea.value = tempValue;

            if (currentMode === 'latinToBrahmi') {
                labelLeft.innerText = "Latin (Input)";
                labelRight.innerText = "Aksara Brahmi (Hasil)";
                labelRight.className = "text-xs font-bold text-indigo-500 uppercase tracking-widest";
                inputArea.classList.remove('brahmi-font');
                outputArea.classList.add('brahmi-font');
                inputArea.placeholder = "Masukkan teks Latin di sini...";
                outputArea.placeholder = "Hasil aksara akan muncul secara otomatis...";
                switchIcon.style.transform = "rotate(0deg)";
            } else {
                labelLeft.innerText = "Aksara Brahmi (Input)";
                labelRight.innerText = "Latin (Hasil)";
                labelRight.className = "text-xs font-bold text-slate-500 uppercase tracking-widest";
                inputArea.classList.add('brahmi-font');
                outputArea.classList.remove('brahmi-font');
                inputArea.placeholder = "Masukkan aksara Brahmi di sini...";
                outputArea.placeholder = "Hasil Latin akan muncul secara otomatis...";
                switchIcon.style.transform = "rotate(180deg)";
            }
            solve();
        }

        function clearText() {
            document.getElementById('inputArea').value = "";
            document.getElementById('outputArea').value = "";
            document.getElementById('inputArea').focus();
        }

        function copyResult() {
            const output = document.getElementById('outputArea');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        document.getElementById('inputArea').addEventListener('input', solve);

        window.onload = () => {
            // Membiarkan input kosong agar placeholder terlihat
            document.getElementById('inputArea').value = "";
            solve();
        };
    </script>
</body>
</html>
